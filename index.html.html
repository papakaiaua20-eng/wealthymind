<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จิตวิทยามั่งคั่ง · ค้นหาบุคลิกภาพของเรา</title>
<meta name="description" content="แบบฝึกหัดสำรวจตัวเอง ค้นหาบุคลิกภาพของเราใน 5 แบบ พร้อมวิธีอยู่ร่วมกับคนทั้ง 5 บุคลิก จากหนังสือจิตวิทยามั่งคั่ง">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F8}
a{color:#3243A8}a:hover{color:#1F2C7A}
button{font-family:inherit}
button:disabled{cursor:default}
.nudge-arrow{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){.nudge-arrow{animation:none}}
@media (max-width:600px){
  .pad{padding:28px 20px !important}
  .pad-s{padding:22px 16px !important}
  .h-xl{font-size:34px !important}
  .h-l{font-size:26px !important}
}
</style>
</head>
<body>
<div id="app"></div>

<template id="tpl">
<div style="min-height: 100vh; background: #F3F5F8; color: #1B2430; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; font-size: 16px; line-height: 1.7; padding: 40px 16px 64px; box-sizing: border-box">
<div style="max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

<sc-if value="{{showLogin}}">
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center">
<div class="pad" style="width: 100%; max-width: 520px; background: #FFFFFF; border-radius: 22px; padding: 44px 40px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 1px 2px rgba(20,30,50,0.06), 0 12px 32px rgba(20,30,50,0.06); box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 10px; text-align: center; align-items: center">
<div style="width: 80px; height: 80px; border-radius: 22px; background: #3243A8; border: 3px solid #FBBF24; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="58" height="58" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 26 L22 16 L32 21 L52 8" stroke="#FBBF24" stroke-width="4"></path><path d="M43 8 H52 V17" stroke="#FBBF24" stroke-width="4"></path><circle cx="32" cy="35" r="6" stroke="#FBBF24" stroke-width="3.6"></circle><path d="M21 57 c0-6 5-11 11-11 s11 5 11 11" stroke="#FBBF24" stroke-width="3.6"></path><circle cx="13" cy="40" r="4.5" stroke="#FFFFFF" stroke-width="3.2"></circle><path d="M5 56 c0-4.5 3.5-8 8-8" stroke="#FFFFFF" stroke-width="3.2"></path><circle cx="51" cy="40" r="4.5" stroke="#FFFFFF" stroke-width="3.2"></circle><path d="M59 56 c0-4.5-3.5-8-8-8" stroke="#FFFFFF" stroke-width="3.2"></path></svg></div>
<div style="font-size: 14px; font-weight: 600; color: #3243A8; letter-spacing: 0.04em">จิตวิทยามั่งคั่ง</div>
<h1 style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 32px; line-height: 1.3; font-weight: 700">ยินดีต้อนรับครับ</h1>
<p style="margin: 0; color: #4A5565">กรอกชื่อของคุณก่อนเริ่ม เพื่อให้เราช่วยวิเคราะห์และสรุปผลในชื่อของคุณ</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 600">ชื่อเรียก</span>
<input id="nick" type="text" value="{{nick}}" onChange="{{onNick}}" onKeydown="{{onNickKey}}" placeholder="ชื่อเล่น / ชื่อจริง" autocomplete="nickname" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #C9CFD8; font-family: inherit; font-size: 17px; color: #1B2430; background: #FFFFFF; box-sizing: border-box; width: 100%">
</label>
<div style="font-size: 14px; color: #5B6573">( สำหรับให้เราช่วยวิเคราะห์ ) ชื่อจะใช้แสดงในผลลัพธ์และไฟล์ PDF ของคุณเท่านั้น</div>
</div>
<button type="button" onClick="{{enter}}" disabled="{{noEnter}}" style="min-height: 54px; border: none; border-radius: 12px; background: #3243A8; color: #FFFFFF; font-size: 17px; font-weight: 600; cursor: pointer; opacity: {{enterOpacity}}">เข้าสู่แบบทดสอบ →</button>
</div>
</div>
</sc-if>

<sc-if value="{{showIntro}}">
<div style="display: flex; flex-direction: column; gap: 24px">
<div class="pad" style="background: #FFFFFF; border-radius: 20px; padding: 48px 40px; display: flex; flex-direction: column; gap: 28px; box-shadow: 0 1px 2px rgba(20,30,50,0.06)">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 14px; font-weight: 600; color: #3243A8; letter-spacing: 0.04em">จิตวิทยามั่งคั่ง · แบบฝึกหัดสำรวจตัวเอง</div>
<div style="font-size: 18px; font-weight: 600">สวัสดีครับ คุณ{{displayName}}</div>
<h1 class="h-xl" style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 44px; line-height: 1.25; font-weight: 700">ค้นหาบุคลิกภาพและตัวตนของเรา</h1>
<p style="margin: 0; font-size: 18px; color: #4A5565; max-width: 700px">เคยรู้สึกไหมครับว่า บางครั้งคนรอบข้างกลับมองเห็นความสามารถของเรา มากกว่าที่เรามองเห็นตัวเองเสียอีก? ลองตอบ 5 สถานการณ์นี้ตามความเป็นจริง แล้วมาค้นหาจุดแข็งที่ซ่อนอยู่ พร้อมวิธีอยู่ร่วมกับคนทั้ง 5 บุคลิกให้เข้าใจกันมากขึ้น</p>
<p style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 20px; font-weight: 600; color: #1B2430">เพราะบางครั้ง สิ่งที่เราทำได้ดีที่สุด อาจเป็นสิ่งที่เรามองข้ามมากที่สุดก็ได้</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px; padding: 20px; border-radius: 14px; border: 1px solid #E2E6EC">
<div style="font-family: 'Anuphan', sans-serif; font-size: 28px; font-weight: 700; color: #3243A8">1</div>
<div style="font-weight: 600">เลือกได้มากกว่า 1 ข้อ</div>
<div style="color: #4A5565; font-size: 15px">คนเราไม่ได้มีนิสัยเพียงด้านเดียว เลือกทุกข้อที่ตรงกับเรา แต่ละข้อได้ 1 คะแนน</div>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px; padding: 20px; border-radius: 14px; border: 1px solid #E2E6EC">
<div style="font-family: 'Anuphan', sans-serif; font-size: 28px; font-weight: 700; color: #3243A8">2</div>
<div style="font-weight: 600">ค้นพบบุคลิกผสมของเรา</div>
<div style="color: #4A5565; font-size: 15px">รู้ว่าเรามีบุคลิกเด่นด้านไหน จุดแข็งคืออะไร และพลังที่ซ่อนอยู่ในตัวเรา</div>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px; padding: 20px; border-radius: 14px; border: 1px solid #E2E6EC">
<div style="font-family: 'Anuphan', sans-serif; font-size: 28px; font-weight: 700; color: #3243A8">3</div>
<div style="font-weight: 600">เข้าใจคนรอบข้าง</div>
<div style="color: #4A5565; font-size: 15px">วิธีปรับตัวและพูดกับคนแต่ละแบบ ทั้งที่ทำงาน เพื่อน และครอบครัว</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="display: inline-flex; align-items: center; color: #D97706"><svg class="nudge-arrow" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg></span>
<button type="button" onClick="{{start}}" style="min-height: 60px; padding: 0 36px; border: 3px solid #B45309; border-radius: 14px; background: #FBBF24; color: #1B2430; font-family: 'Anuphan', sans-serif; font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px rgba(217,119,6,0.35)">เริ่มค้นหาตัวตนของเรา</button>
</div>
<span style="color: #5B6573; font-size: 14px">ใช้เวลาประมาณ 2 นาที · ไม่มีคำตอบถูกหรือผิด ขอเพียงตอบตามความเป็นจริง</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 4px 0">
<h2 style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 26px; font-weight: 700">ไขความลับตัวตน 5 ประเภท</h2>
<p style="margin: 0; color: #4A5565">แต่ละคนมีพื้นฐานความคิด อารมณ์ และพฤติกรรมที่ไม่เหมือนกัน และนี่แหละครับ คือสิ่งที่ทำให้แต่ละคนมีคุณค่าในแบบของตัวเอง</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<sc-for list="{{types}}" as="t">
<div style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 14px 14px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(20,30,50,0.06)">
<x-illus k="{{t.key}}" h="150" r="12"></x-illus>
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<span style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: {{t.color}}; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center">{{t.key}}</span>
<div style="display: flex; flex-direction: column">
<div style="font-family: 'Anuphan', sans-serif; font-size: 19px; font-weight: 700; line-height: 1.3">{{t.name}}</div>
<div style="font-size: 12px; color: #5B6573; letter-spacing: 0.04em">{{t.en}}</div>
</div>
</div>
<div style="font-size: 15px; color: #3A4452; padding: 0 8px">{{t.about}}</div>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{showQuiz}}">
<div class="pad" style="background: #FFFFFF; border-radius: 20px; padding: 40px; display: flex; flex-direction: column; gap: 28px; box-shadow: 0 1px 2px rgba(20,30,50,0.06)">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 14px; color: #5B6573; font-weight: 500">
<span>ข้อ {{qNum}} จาก {{qTotal}}</span>
<span style="display: inline-flex; align-items: center; gap: 12px">ตอบแล้ว {{answeredCount}} คำถาม<button type="button" onClick="{{restart}}" style="min-height: 44px; padding: 0 12px; border: none; background: transparent; color: #3243A8; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>เริ่มใหม่</button></span>
</div>
<div style="height: 8px; border-radius: 999px; background: #E6E9EF; overflow: hidden">
<div style="height: 100%; width: {{progressPct}}%; background: #3243A8; border-radius: 999px; transition: width 0.25s"></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 class="h-l" style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 30px; line-height: 1.35; font-weight: 700">{{qText}}</h2>
<div style="color: #4A5565; font-size: 15px">เลือกทุกข้อที่อ่านแล้วรู้สึกว่า “นี่แหละเรา” เลือกได้มากกว่า 1 ข้อ · เลือกแล้ว {{pickedCount}} ข้อ</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{options}}" as="o">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; align-items: center; gap: 16px; width: 100%; min-height: 60px; padding: 12px 18px; text-align: left; border-radius: 14px; border: 2px solid {{o.border}}; background: {{o.bg}}; color: #1B2430; font-size: 17px; cursor: pointer">
<span style="flex: none; width: 34px; height: 34px; border-radius: 10px; background: {{o.badgeBg}}; color: {{o.badgeFg}}; display: flex; align-items: center; justify-content: center; font-weight: 600">{{o.key}}</span>
<span style="line-height: 1.6">{{o.text}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<button type="button" onClick="{{prev}}" disabled="{{noPrev}}" style="min-height: 48px; padding: 0 22px; border-radius: 12px; border: 1px solid #C9CFD8; background: #FFFFFF; color: #1B2430; font-size: 16px; cursor: pointer">← ย้อนกลับ</button>
<button type="button" onClick="{{next}}" disabled="{{noNext}}" style="min-height: 48px; padding: 0 26px; border-radius: 12px; border: none; background: #3243A8; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer; opacity: {{nextOpacity}}">{{nextLabel}}</button>
</div>
</div>
</sc-if>

<sc-if value="{{showResult}}">
<div style="display: flex; flex-direction: column; gap: 28px">

<div class="pad" style="background: #1B2430; color: #FFFFFF; border-radius: 22px; padding: 44px 40px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="font-size: 14px; font-weight: 600; color: #B9C2F0; letter-spacing: 0.06em">ผลของคุณ</div>
<button type="button" onClick="{{restart}}" style="min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #4A5568; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>รีเซ็ตและเริ่มใหม่</button>
</div>
<x-combo keys="{{comboKeyStr}}" h="260"></x-combo>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<sc-for list="{{comboTypes}}" as="c">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 20px 12px 12px; border-radius: 18px; background: #26303E">
<span style="flex: none; width: 64px; height: 64px; border-radius: 16px; background: {{c.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><x-icon k="{{c.key}}" s="34"></x-icon></span>
<div style="display: flex; flex-direction: column; line-height: 1.35">
<span style="font-family: 'Anuphan', sans-serif; font-size: 20px; font-weight: 700">{{c.name}}</span>
<span style="font-size: 13px; color: #AEB7C5; letter-spacing: 0.04em">{{c.en}}</span>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 17px; color: #D5DAE3">คุณ{{displayName}} คือ{{comboNames}}</div>
<h1 class="h-xl" style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 44px; line-height: 1.25; font-weight: 700">“{{combo.nick}}”</h1>
</div>
<p style="margin: 0; font-size: 18px; line-height: 1.9; color: #E8EBF0">{{combo.you}}</p>
<div style="padding: 24px 26px; border-radius: 16px; background: #26303E; border: 1px solid #3A4656">
<p style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 23px; line-height: 1.55; font-weight: 600">{{combo.quote}}</p>
</div>
<sc-if value="{{isMixed}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; color: #C7CEDA">คุณได้คะแนนสูงสุดเท่ากันหลายด้าน เลือกด้านที่อยากใช้เป็นมุมมองหลักในคำแนะนำการอยู่ร่วมกับคนอื่น</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{lensPills}}" as="p">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid {{p.color}}; background: {{p.bg}}; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">{{p.name}}</button>
</sc-for>
</div>
</div>
</sc-if>
</div>

<x-save></x-save>

<div class="pad" style="background: #FFFFFF; border-radius: 20px; padding: 36px 40px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 2px rgba(20,30,50,0.06)">
<h2 style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 28px; font-weight: 700">เมื่อพลังของคุณผสานกัน</h2>
<div style="padding: 22px 24px; border-radius: 16px; background: #EDF7F4; border: 1.5px solid #B5DDD3; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Anuphan', sans-serif; font-weight: 700; color: #0F6B5E; font-size: 22px">พลังที่คุณมี</div>
<div style="font-size: 17px; white-space: pre-line; line-height: 1.85">{{combo.power}}</div>
</div>
<div style="padding: 22px 24px; border-radius: 16px; background: #FDF3EC; border: 1.5px solid #F1CDB4; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Anuphan', sans-serif; font-weight: 700; color: #9A3412; font-size: 22px">สิ่งที่ต้องรู้เท่าทัน</div>
<div style="font-size: 17px; white-space: pre-line; line-height: 1.85">{{combo.watch}}</div>
</div>
<p style="margin: 0; color: #4A5565">จุดแข็งและข้อจำกัดมักอยู่ใกล้กันครับ หากรู้จักใช้ให้ถูกทาง สิ่งที่เคยถูกมองว่าเป็นข้อเสีย จะกลายเป็นพลังที่พาเราไปได้ไกลกว่าเดิม</p>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 4px 4px 0">
<h2 style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 28px; font-weight: 700">บุคลิกเด่นของคุณ</h2>
</div>
<sc-for list="{{comboTypes}}" as="c">
<div class="pad-s" style="background: {{c.tint}}; border: 3px solid {{c.color}}; border-radius: 20px; padding: 32px 36px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 16px">
<span style="flex: none; width: 56px; height: 56px; border-radius: 14px; background: {{c.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><x-icon k="{{c.key}}" s="30"></x-icon></span>
<div style="display: flex; flex-direction: column">
<div style="font-family: 'Anuphan', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.3; color: {{c.ink}}">{{c.name}}</div>
<div style="font-size: 13px; color: #5B6573; font-weight: 500; letter-spacing: 0.04em">{{c.en}}</div>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 14px; padding: 10px">
<x-illus k="{{c.key}}" h="200" r="10"></x-illus>
</div>
<div style="background: #FFFFFF; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Anuphan', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.4; color: {{c.ink}}">จุดแข็ง</div>

var HOLE = /\{\{([^}]+)\}\}/g;
function lookup(scope, expr) {
  expr = String(expr).trim();
  if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
  if (expr === 'true') return true;
  if (expr === 'false') return false;
  var v = scope, parts = expr.split('.');
  for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
  return v;
}
function single(str) { var m = String(str || '').match(/^\s*\{\{([^}]+)\}\}\s*$/); return m ? m[1] : null; }
function interp(str, scope) { return str.replace(HOLE, function (_, e) { var v = lookup(scope, e); return v == null ? '' : String(v); }); }
function fromHtml(html) { var t = document.createElement('template'); t.innerHTML = html; return Array.prototype.slice.call(t.content.childNodes); }

function proc(node, scope) {
  if (node.nodeType === 3) { if (node.nodeValue.indexOf('{{') >= 0) node.nodeValue = interp(node.nodeValue, scope); return [node]; }
  if (node.nodeType !== 1) return [];
  var tag = node.localName;
  if (tag === 'sc-if') return lookup(scope, single(node.getAttribute('value'))) ? procChildren(node, scope) : [];
  if (tag === 'sc-for') {
    var list = lookup(scope, single(node.getAttribute('list'))) || [], as = node.getAttribute('as'), out = [];
    list.forEach(function (item) { var s = Object.create(scope); s[as] = item; out = out.concat(procChildren(node.cloneNode(true), s)); });
    return out;
  }
  if (tag === 'x-icon') return fromHtml(iconSvg(interp(node.getAttribute('k'), scope), node.getAttribute('s') || 24));
  if (tag === 'x-illus') return fromHtml(illusHtml(interp(node.getAttribute('k'), scope), node.getAttribute('h') || 200, node.getAttribute('r') || 16));
  if (tag === 'x-combo') return fromHtml(comboHtml(interp(node.getAttribute('keys'), scope), node.getAttribute('h') || 260));
  if (tag === 'x-save') return procChildren(document.importNode(document.getElementById('tpl-save').content, true), scope);
  Array.prototype.slice.call(node.attributes).forEach(function (a) {
    var n = a.name, v = a.value;
    if (v.indexOf('{{') < 0) return;
    var e = single(v);
    if (n.indexOf('on') === 0) {
      node.removeAttribute(n);
      var fn = lookup(scope, e);
      if (typeof fn === 'function') node.addEventListener(n === 'onchange' ? 'input' : n.slice(2), fn);
      return;
    }
    if (n === 'disabled') { node.removeAttribute(n); if (lookup(scope, e)) node.setAttribute('disabled', ''); return; }
    if (n === 'value') { node.removeAttribute(n); var val = lookup(scope, e); node.value = val == null ? '' : val; return; }
    node.setAttribute(n, interp(v, scope));
  });
  var kids = procChildren(node, scope);
  while (node.firstChild) node.removeChild(node.firstChild);
  kids.forEach(function (k) { node.appendChild(k); });
  return [node];
}
function procChildren(node, scope) {
  var out = [];
  Array.prototype.slice.call(node.childNodes).forEach(function (c) { out = out.concat(proc(c, scope)); });
  return out;
}

var app = document.getElementById('app');
var tpl = document.getElementById('tpl');
var comp = null, queued = false;
function render() {
  queued = false;
  var ae = document.activeElement, focusId = ae && ae.id, s0 = null, s1 = null;
  if (focusId && ae.setSelectionRange) { try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch (e) {} }
  var vals = comp.renderVals();
  var nodes = procChildren(document.importNode(tpl.content, true), vals);
  while (app.firstChild) app.removeChild(app.firstChild);
  nodes.forEach(function (n) { app.appendChild(n); });
  if (focusId) {
    var el = document.getElementById(focusId);
    if (el) { el.focus(); if (s0 != null && el.setSelectionRange) { try { el.setSelectionRange(s0, s1); } catch (e) {} } }
  }
}
function schedule() { if (queued) return; queued = true; Promise.resolve().then(render); }

function DCLogic(props) { this.props = props || {}; this.state = {}; }
DCLogic.prototype.setState = function (p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); schedule(); };

function saveFile(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}

    const r = this._report;
    if (!r || this.state.pdfBusy) return;
    this.setState({ pdfBusy: true, pdfMsg: 'กำลังสร้างไฟล์ PDF…' });
    try {
      const bytes = await this.buildPdf(r);
      const who = (r.nick || r.real || 'ของฉัน').replace(/[\\/:*?"<>|]/g, '');
      const filename = 'ผลบุคลิกภาพ-' + who + '.pdf';
      if (share) {
        let shared = false;
        try {
          const file = new File([bytes], filename, { type: 'application/pdf' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'ผลบุคลิกภาพของ' + who, text: who + ' คือ' + r.comboNames + ' — “' + r.combo.nick + '”' });
            shared = true;
          }
        } catch (e) { if (e && e.name === 'AbortError') { this.setState({ pdfBusy: false, pdfMsg: '' }); return; } }
        if (shared) { this.setState({ pdfBusy: false, pdfMsg: 'แชร์เรียบร้อยแล้วครับ' }); return; }
      }
      saveFile(new Blob([bytes], { type: 'application/pdf' }), filename);
      this.setState({ pdfBusy: false, pdfMsg: share ? 'อุปกรณ์นี้แชร์ไฟล์โดยตรงไม่ได้ จึงบันทึกเป็น PDF ให้แทน ส่งไฟล์นี้ต่อทาง LINE หรืออีเมลได้เลยครับ' : 'บันทึกไฟล์ PDF แล้วครับ' });
    } catch (e) {
      this.setState({ pdfBusy: false, pdfMsg: 'สร้างไฟล์ไม่สำเร็จ ลองใหม่อีกครั้งครับ' });
    }
  }

  async buildPdf(r) {
    try {
      await Promise.all([
        document.fonts.load("700 40px 'Anuphan'"), document.fonts.load("600 30px 'Anuphan'"),
        document.fonts.load("400 24px 'IBM Plex Sans Thai'"), document.fonts.load("600 24px 'IBM Plex Sans Thai'")
      ]);
    } catch (e) {}
    const W = 1240, H = 1754, M = 96, CW = W - M * 2;
    const HEAD = "'Anuphan', 'IBM Plex Sans Thai', sans-serif";
    const BODY = "'IBM Plex Sans Thai', sans-serif";
    const pages = [];
    let ctx = null, y = 0;
    const seg = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
    const newPage = () => {
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      ctx = c.getContext('2d'); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
      ctx.textBaseline = 'top'; pages.push(c); y = M;
      ctx.font = '400 18px ' + BODY; ctx.fillStyle = '#8A93A1';
      ctx.fillText('จิตวิทยามั่งคั่ง · ผลการค้นหาบุคลิกภาพ' + (r.nick || r.real ? ' · ' + (r.nick || r.real) : ''), M, H - 60);
      const pn = 'หน้า ' + pages.length; ctx.fillText(pn, W - M - ctx.measureText(pn).width, H - 60);
    };
    const ensure = (h) => { if (y + h > H - 110) newPage(); };
    const wrap = (text, font, maxW) => {
      ctx.font = font; const out = [];
      String(text).split('\n').forEach((para) => {
        const parts = seg ? Array.from(seg.segment(para), (x) => x.segment) : Array.from(para);
        let line = '';
        parts.forEach((w) => {
          const t = line + w;
          if (ctx.measureText(t).width > maxW && line) { out.push(line.trimEnd()); line = w.trimStart(); }
          else line = t;
        });
        out.push(line);
      });
      return out;
    };
    const text = (str, o) => {
      o = o || {}; const size = o.size || 24; const font = (o.weight || 400) + ' ' + size + 'px ' + (o.head ? HEAD : BODY);
      const lh = Math.round(size * (o.lh || 1.7)); const x = M + (o.indent || 0); const maxW = (o.width || CW) - (o.indent || 0);
      wrap(str, font, maxW).forEach((ln) => { ensure(lh); ctx.font = font; ctx.fillStyle = o.color || '#1B2430'; ctx.fillText(ln, x, y + (lh - size) / 2); y += lh; });
      y += o.after != null ? o.after : 10;
    };
    const rule = (color) => { ensure(24); ctx.fillStyle = color || '#E6E9EF'; ctx.fillRect(M, y + 8, CW, 2); y += 26; };
    const heading = (str, color) => { ensure(90); y += 14; text(str, { size: 34, weight: 700, head: true, color: color || '#1B2430', lh: 1.4, after: 6 }); };
    const label = (str, color) => { ensure(70); text(str, { size: 25, weight: 700, head: true, color: color, lh: 1.5, after: 2 }); };

    newPage();
    ctx.fillStyle = '#1B2430'; ctx.fillRect(0, 0, W, 330); y = 70;
    text('ผลของคุณ · จิตวิทยามั่งคั่ง', { size: 22, weight: 600, color: '#B9C2F0', after: 6 });
    const nm = r.nick && r.real ? r.nick + ' (' + r.real + ')' : (r.nick || r.real || '');
    if (nm) text('คุณ' + nm, { size: 26, weight: 600, color: '#FFFFFF', after: 4 });
    text('คือ' + r.comboNames, { size: 26, weight: 400, color: '#D5DAE3', after: 6 });
    text('“' + r.combo.nick + '”', { size: 52, weight: 700, head: true, color: '#FFFFFF', lh: 1.35, after: 0 });
    y = 380;
    text(r.combo.you, { size: 25, lh: 1.85, after: 20 });
    const qLines = wrap('“' + r.combo.quote + '”', '700 30px ' + HEAD, CW - 60);
    const qh = qLines.length * 48 + 48; ensure(qh);
    ctx.fillStyle = '#EEF0FA'; ctx.fillRect(M, y, CW, qh); ctx.fillStyle = '#3243A8'; ctx.fillRect(M, y, 8, qh);
    let qy = y + 24; qLines.forEach((ln) => { ctx.font = '700 30px ' + HEAD; ctx.fillStyle = '#1B2430'; ctx.fillText(ln, M + 34, qy + 9); qy += 48; });
    y += qh + 24;

    heading('เมื่อพลังของคุณผสานกัน');
    label('พลังที่คุณมี', '#0F6B5E'); text(r.combo.power, { after: 14 });
    label('สิ่งที่ต้องรู้เท่าทัน', '#9A3412'); text(r.combo.watch, { after: 14 });

    heading('สรุปคะแนน');
    text('รวม ' + r.totalScore + ' คะแนน จาก ' + r.total + ' คำถาม', { size: 22, color: '#5B6573', after: 10 });
    r.scoreRows.forEach((row) => {
      ensure(64); ctx.font = '600 24px ' + BODY; ctx.fillStyle = row.color; ctx.fillText(row.key + ' · ' + row.name, M, y);
      ctx.fillStyle = '#1B2430'; const sc = String(row.score); ctx.fillText(sc, W - M - ctx.measureText(sc).width, y);
      ctx.fillStyle = '#E6E9EF'; ctx.fillRect(M, y + 38, CW, 12); ctx.fillStyle = row.color; ctx.fillRect(M, y + 38, Math.round(CW * row.pct / 100), 12);
      y += 70;
    });

    r.comboTypes.forEach((t) => {
      heading(t.name + '  ·  ' + t.en, t.ink);
      label('จุดแข็ง', t.ink); text(t.strength, { after: 12 });
      label('จุดที่ควรพัฒนา', t.ink); text(t.develop, { after: 12 });
      label('พลังที่ซ่อนอยู่', t.ink); text(t.hidden, { after: 12 });
    });

    newPage();
    text('เมื่อต้องอยู่ร่วมกับทั้ง 5 บุคลิก', { size: 40, weight: 700, head: true, lh: 1.35, after: 8 });
    text('เราแต่ละคนมีตัวตน และนิสัยที่ต่างกัน', { size: 26, weight: 700, head: true, lh: 1.5, after: 2 });
    text('“ สังคมผู้คนรอบข้างมีส่วนสำคัญ\nต่อเส้นทางความสำเร็จของเรา ”', { size: 24, weight: 600, color: '#3243A8', after: 8 });
    text('เมื่อเราเข้าใจผู้อื่นที่แตกต่างกัน และรู้จักปรับตัวเข้าหา เราจะสร้างความสัมพันธ์ที่ดี เปิดโอกาสใหม่ ๆ ก้าวไปสู่ชีวิตที่ประสบความสำเร็จ และมั่งคั่งได้ง่ายขึ้น', { size: 27, weight: 700, head: true, lh: 1.65, color: '#B45309', after: 10 });
    text('พร้อมคำแนะนำเฉพาะสำหรับเรา ในแบบ' + r.lensName, { size: 24, weight: 700, after: 6 });
    r.guides.forEach((g, gi) => {
      if (gi > 0) newPage(); else rule();
      ctx.fillStyle = g.color; ensure(80); ctx.fillRect(M, y, CW, 70);
      ctx.font = '700 32px ' + HEAD; ctx.fillStyle = '#FFFFFF'; ctx.fillText('เมื่อเจอ' + g.name + '  ·  ' + g.en, M + 24, y + 16); y += 92;
      label('ดูนิสัย ก็รู้ว่าเขาเป็นคนแบบไหน', g.ink); text(g.spot, { after: 10 });
      label('ในใจลึก ๆ ที่เขาต้องการ', g.ink); text(g.needs, { after: 10 });
      label('อย่าเพิ่งเข้าใจเขาผิด', g.ink); text(g.accept, { after: 10 });
      label('ปรับตัวเมื่อทำงานร่วมกัน ให้งานเดินดีขึ้น', g.ink);
      g.workItems.forEach((w) => { text(w.n + '. ' + w.lead, { weight: 600, after: 0 }); text(w.why, { color: '#3A4452', indent: 34, after: 8 }); });
      label('ปรับตัวให้เข้าใจกัน กับเพื่อนและครอบครัว', g.ink);
      g.homeItems.forEach((w) => { text(w.n + '. ' + w.lead, { weight: 600, after: 0 }); text(w.why, { color: '#3A4452', indent: 34, after: 8 }); });
      label('ประโยคที่ใช้ได้เลย', '#3A4452'); text(g.say, { weight: 600, after: 10 });
      label('สำหรับ' + r.lensName + 'อย่างคุณ', '#3243A8'); text(g.forYou, { after: 10 });
    });
    rule();
    text('ความมั่งคั่งที่แท้จริง เริ่มต้นจากการเข้าใจตัวเอง เข้าใจผู้อื่น และรู้จักนำสิ่งที่มีมาต่อยอด เพื่อสร้างชีวิตที่ประสบความสำเร็จและมีความสุขอย่างยั่งยืนครับ', { size: 28, weight: 700, head: true, lh: 1.6, after: 6 });
    text('— จิตวิทยามั่งคั่ง', { size: 22, color: '#5B6573', after: 16 });
    text('หมายเหตุ: แบบฝึกหัดนี้เป็นเครื่องมือสำรวจตัวเองเบื้องต้น ไม่ใช่แบบทดสอบหรือเครื่องมือวินิจฉัยทางจิตวิทยาที่ผ่านการรับรองมาตรฐาน', { size: 20, color: '#5B6573' });

    const imgs = pages.map((c) => {
      const b64 = c.toDataURL('image/jpeg', 0.9).split(',')[1];
      const bin = atob(b64); const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    });
    return this.writePdf(imgs, W, H);
  }

  writePdf(imgs, W, H) {
    const enc = new TextEncoder(); const chunks = []; const offs = []; let len = 0;
    const put = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
    const obj = (n) => { offs[n] = len; put(n + ' 0 obj\n'); };
    put('%PDF-1.4\n'); put(new Uint8Array([37, 226, 227, 207, 211, 10]));
    const n = imgs.length; const kids = [];
    for (let i = 0; i < n; i++) kids.push((3 + i * 3) + ' 0 R');
    obj(1); put('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    obj(2); put('<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>\nendobj\n');
    imgs.forEach((img, i) => {
      const pg = 3 + i * 3, im = pg + 1, ct = pg + 2;
      obj(pg); put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>\nendobj\n');
      obj(im); put('<< /Type /XObject /Subtype /Image /Width ' + W + ' /Height ' + H + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.length + ' >>\nstream\n'); put(img); put('\nendstream\nendobj\n');
      const cs = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
      obj(ct); put('<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream\nendobj\n');
    });
    const total = 3 + n * 3; const xref = len;
    let x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
    for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    put(x); put('trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
    const out = new Uint8Array(len); let p = 0; chunks.forEach((c) => { out.set(c, p); p += c.length; });
    return out;
  }

  renderVals() {
    const tints = {
      A: { tint: '#FFF4EC', line: '#F2C8AC', ink: '#9A3412' },
      B: { tint: '#F5F0FF', line: '#D5C5F6', ink: '#5B21B6' },
      C: { tint: '#ECF7F4', line: '#B3DCD3', ink: '#0F5F56' },
      D: { tint: '#EEF3FF', line: '#BED0F6', ink: '#1E3FA8' },
      E: { tint: '#FDF0F6', line: '#F0C0D6', ink: '#9D174D' }
    };
    const types = this.types().map((t) => Object.assign({}, t, tints[t.key]));
    const qs = this.questions();
    const keys = ['A', 'B', 'C', 'D', 'E'];
    const st = this.state;
    const total = qs.length;
    const answered = st.answers.filter((a) => a.length > 0).length;
    const toTop = () => { try { window.scrollTo(0, 0); } catch (e) {} };
    const canEnter = !!(st.nick.trim() || st.real.trim());
    const enter = () => { if (this.state.nick.trim() || this.state.real.trim()) { this.setState({ step: 'intro' }); toTop(); } };

    const vals = {
      types: types,
      showLogin: st.step === 'login',
      showIntro: st.step === 'intro',
      nick: st.nick, real: st.real,
      displayName: (st.nick || st.real || '').trim(),
      onNick: (e) => this.setState({ nick: e.target.value }),
      onNickKey: (e) => { if (e.key === 'Enter') enter(); },
      noEnter: !canEnter,
      enterOpacity: canEnter ? '1' : '0.45',
      enter: enter,
      pdfBusy: st.pdfBusy, pdfMsg: st.pdfMsg, hasPdfMsg: !!st.pdfMsg,
      downloadPdf: () => this.exportPdf(false),
      sharePdf: () => this.exportPdf(true),
      showQuiz: st.step === 'quiz',
      showResult: st.step === 'result',
      qTotal: total,
      start: () => { this.setState({ step: 'quiz', q: 0, answers: [[], [], [], [], []], lens: null }); toTop(); },
      restart: () => { this.setState({ step: 'login', q: 0, answers: [[], [], [], [], []], lens: null, nick: '', real: '', pdfMsg: '' }); toTop(); }
    };

    if (st.step === 'quiz') {
      const q = qs[st.q];
      const cur = st.answers[st.q];
      const isLast = st.q === total - 1;
      vals.qNum = st.q + 1;
      vals.answeredCount = answered;
      vals.progressPct = Math.round((answered / total) * 100);
      vals.qText = q.text;
      vals.options = q.opts.map((text, i) => {
        const k = keys[i];
        const sel = cur.indexOf(k) >= 0;
        return {
          key: k, text: text, pressed: sel ? 'true' : 'false',
          border: sel ? '#3243A8' : '#E2E6EC',
          bg: sel ? '#EEF0FA' : '#FFFFFF',
          badgeBg: sel ? '#3243A8' : '#F3F5F8',
          badgeFg: sel ? '#FFFFFF' : '#1B2430',
          pick: () => {
            const answers = this.state.answers.map((a) => a.slice());
            const list = answers[this.state.q];
            const at = list.indexOf(k);
            if (at >= 0) list.splice(at, 1); else list.push(k);
            list.sort();
            this.setState({ answers: answers });
          }
        };
      });
      vals.noPrev = st.q === 0;
      vals.noNext = cur.length === 0;
      vals.nextOpacity = cur.length === 0 ? '0.45' : '1';
      vals.pickedCount = cur.length;
      vals.nextLabel = isLast ? 'ดูผลลัพธ์ของฉัน →' : 'ถัดไป →';
      vals.prev = () => { if (st.q > 0) this.setState({ q: st.q - 1 }); };
      vals.next = () => {
        if (cur.length === 0) return;
        if (isLast) { this.setState({ step: 'result' }); toTop(); }
        else this.setState({ q: st.q + 1 });
      };
    }

    if (st.step === 'result') {
      const scores = {};
      keys.forEach((k) => { scores[k] = 0; });
      st.answers.forEach((list) => { list.forEach((a) => { scores[a] += 1; }); });
      const byKey = {};
      types.forEach((t) => { byKey[t.key] = t; });
      const distinct = Array.from(new Set(keys.map((k) => scores[k]).filter((s) => s > 0))).sort((a, b) => b - a);
      const namesAt = (lvl) => {
        if (distinct[lvl] === undefined) return '—';
        return keys.filter((k) => scores[k] === distinct[lvl]).map((k) => byKey[k].name).join(' · ');
      };
      const primaries = keys.filter((k) => scores[k] === distinct[0]);
      const seconds = distinct[1] !== undefined ? keys.filter((k) => scores[k] === distinct[1]) : [];

      let comboKeys;
      if (primaries.length >= 2) comboKeys = primaries;
      else if (seconds.length === 1) comboKeys = [primaries[0], seconds[0]];
      else comboKeys = [primaries[0]];

      const allCombos = this.combos();
      const combo = comboKeys.length >= 3 ? allCombos.MULTI
        : comboKeys.length === 2 ? allCombos[comboKeys.slice().sort().join('')]
        : allCombos[comboKeys[0]];

      const lensKey = primaries.indexOf(st.lens) >= 0 ? st.lens : primaries[0];
      const lens = byKey[lensKey];
      const pairs = this.pairs();
      const adapt = this.adapt();
      const split = (arr) => arr.map((x, i) => { const parts = x.split('\n'); return { n: i + 1, lead: parts[0], why: parts[1] || '' }; });

      vals.combo = combo;
      vals.comboTypes = comboKeys.map((k) => byKey[k]);
      vals.comboKeyStr = comboKeys.join('');
      vals.comboNames = comboKeys.map((k) => byKey[k].name).join(' + ');
      vals.totalScore = keys.reduce((n, k) => n + scores[k], 0);
      vals.primaryNames = namesAt(0);
      vals.secondNames = namesAt(1);
      vals.thirdNames = namesAt(2);
      vals.isMixed = primaries.length > 1;
      vals.lensName = lens.name;
      vals.lensPills = primaries.map((k) => {
        const on = k === lensKey;
        return {
          name: byKey[k].name, color: byKey[k].color,
          bg: on ? byKey[k].color : 'transparent',
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ lens: k })
        };
      });
      vals.scoreRows = types.map((t) => ({
        key: t.key, name: t.name, en: t.en, color: t.color,
        score: scores[t.key], pct: Math.round((scores[t.key] / total) * 100)
      }));
      vals.guides = types.map((t) => ({
        key: t.key, name: t.name, en: t.en, color: t.color, tint: t.tint, line: t.line, ink: t.ink,
        spot: t.spot, needs: t.needs, accept: t.accept, say: t.say,
        workItems: split(adapt[t.key].work), homeItems: split(adapt[t.key].home),
        isYou: t.key === lensKey,
        forYou: pairs[lensKey + t.key]
      }));
      this._report = {
        nick: st.nick.trim(), real: st.real.trim(), combo: combo, comboNames: vals.comboNames,
        comboTypes: vals.comboTypes, scoreRows: vals.scoreRows, total: total, totalScore: vals.totalScore,
        guides: vals.guides, lensName: lens.name
      };
    }

    return vals;
  }
}

comp = new Component({});
render();
})();
</script>
